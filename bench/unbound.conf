# Unbound as a pure forwarding cache, set up like nirvor's default config, for a fair comparison.
server:
    interface: 127.0.0.1@5301
    access-control: 127.0.0.0/8 allow
    num-threads: NUM_THREADS
    so-reuseport: yes
    do-daemonize: no
    chroot: ""
    username: ""
    directory: "."
    pidfile: ""
    use-syslog: no
    logfile: ""
    verbosity: 0
    module-config: "iterator"
    msg-cache-size: 64m
    rrset-cache-size: 128m
    serve-expired: yes

forward-zone:
    name: "."
    forward-addr: 1.1.1.1
    forward-addr: 8.8.8.8
