[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "Apache-2.0"
repository = "https://github.com/Muktaditbf/nirvor"
rust-version = "1.88"

[workspace.dependencies]
tokio = { version = "=1.54.1", features = ["full"] }
hickory-proto = { version = "=0.26.3", features = ["dnssec-ring"] }
serde = { version = "=1.0.229", features = ["derive"] }
toml = "=1.2.1"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "json"] }
thiserror = "=2.0.21"
anyhow = "=1.0.104"
rand = "=0.10.3"
moka = { version = "=0.12.16", features = ["sync"] }
ipnet = "=2.12.2"
socket2 = { version = "=0.6.5", features = ["all"] }
axum = { version = "=0.8.9", features = ["macros"] }
serde_json = "=1.0.154"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider", "http2"] }
ring = "=0.17.14"
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
data-encoding = "=2.11.1"
sqlx = { version = "=0.9.0", default-features = false, features = ["sqlite", "runtime-tokio"] }
axum-server = { version = "=0.9.2", features = ["tls-rustls-ring"] }
argon2 = "=0.6.0"
tokio-stream = { version = "=0.1.19", features = ["sync"] }
futures-util = { version = "=0.3.34", default-features = false }
rust-embed = { version = "=8.14.0", features = ["mime-guess"] }
proptest = "=1.12.0"
clap = { version = "=4.6.7", features = ["derive"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 4
