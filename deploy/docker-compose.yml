# docker compose -f deploy/docker-compose.yml up -d --build
services:
  nirvor:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: nirvor:latest
    restart: unless-stopped
    ports:
      - "53:53/udp"
      - "53:53/tcp"
      - "127.0.0.1:8053:8053/tcp" # dashboard: keep it off public interfaces
    volumes:
      - nirvor-data:/var/lib/nirvor
      - ./config.docker.toml:/etc/nirvor/config.toml:ro # use a writable directory mount to save dashboard edits
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
volumes:
  nirvor-data:
